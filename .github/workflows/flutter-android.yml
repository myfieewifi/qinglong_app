name: Flutter Android Build (Release APK)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本必须跟 pubspec.lock 对齐，不能随便选新的：
      #   pubspec.yaml / pubspec.lock 要求 Dart ">=2.18.0 <3.0.0" → Flutter 最高 3.7.x
      #   pubspec.lock 锁 intl 0.17.0，而 Flutter 3.7 的 flutter_localizations 要 intl 0.18.0
      #   → 只有 Flutter 3.3.x（自带 intl 0.17.0、Dart 2.18）能原样复用现有 lock 文件。
      # 该版本也与工程里的 AGP 4.1.0 / Gradle 6.7 / Kotlin 1.6.10 / JDK 11 同年代。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.10'
          cache: true

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # app/build.gradle 中 release 和 debug 都引用 app/qinglong.keystore，
      # 但该文件不在仓库里，不补上则 release 必报 Keystore file not found。
      # 配了 KEYSTORE_BASE64 secret 就用正式签名；没配就生成一个仅供 CI 出包的
      # 临时签名（与官方签名不同，覆盖安装前需先卸载旧版）。
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE=flutter/android/app/qinglong.keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "使用 KEYSTORE_BASE64 中的正式签名"
          else
            echo "未配置 KEYSTORE_BASE64，生成 CI 临时签名"
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -alias jiangyuesong -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass jiangyuesong -keypass jiangyuesong \
              -dname "CN=qinglong CI, OU=CI, O=qinglong, L=CN, ST=CN, C=CN"
          fi

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: flutter
        run: flutter build apk --release --build-name=1.0.0 --build-number=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-client-android-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
