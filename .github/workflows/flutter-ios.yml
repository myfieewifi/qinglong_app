name: Flutter iOS (archive)

# 由原 hicongcn/qinglong_app Flutter 工程出 iOS 产物。
# 注意：公开 Runner 上没有 Apple 开发者证书，本流程默认以 --no-codesign 构建未签名 .app / archive；
# 要产出可安装的签名 IPA，需在仓库 Secrets 配置证书(.p12)、描述文件(Provisioning Profile)与打包密码，
# 并在下方签名步骤注入后再执行 flutter build ipa。
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_DIR: flutter

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'

      - name: Resolve dependencies
        working-directory: ${{ env.FLUTTER_DIR }}
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.FLUTTER_DIR }}/ios
        run: pod install --repo-update

      # 无证书环境：未签名构建。若已配置签名 Secrets，可改为：
      #   flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Build unsigned iOS archive
        working-directory: ${{ env.FLUTTER_DIR }}
        run: flutter build ios --release --no-codesign --debug

      - name: Locate .app
        id: find_app
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          APP=$(find build/ios -name "Runner.app" -type d | head -n1)
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "APP: $APP"

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-client-ios-unsigned-app
          path: ${{ env.FLUTTER_DIR }}/${{ steps.find_app.outputs.app_path }}

      # ===== 可选：签名出 IPA（需在 Secrets 配置下列材料后启用） =====
      # secrets:
      #   IOS_P12_BASE64        开发者证书 .p12 的 base64
      #   IOS_P12_PASSWORD      证书密码
      #   IOS_PROFILE_BASE64    描述文件 base64
      #   IOS_KEYCHAIN_PASSWORD 钥匙串密码
      # - name: Sign and export IPA
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   working-directory: ${{ env.FLUTTER_DIR }}
      #   run: flutter build ipa --release
