name: Flutter iOS Build (TrollStore Unsigned IPA)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths: [ 'flutter/**', '.github/workflows/flutter-ios.yml' ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 同 Android：pubspec 要求 Dart <3.0.0，且 lock 锁 intl 0.17.0，
      # 只有 Flutter 3.3.x（Dart 2.18、flutter_localizations 依赖 intl 0.17.0）能复用 lock。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.10'
          cache: true

      # Flutter 3.3 的构建脚本不兼容 Xcode 15+ 引入的 DT_TOOLCHAIN_DIR，
      # 典型报错是 "DT_TOOLCHAIN_DIR cannot be used to evaluate LD_RUNPATH_SEARCH_PATHS"。
      # 镜像里有 Xcode 14 就强制选它；没有则给出明确告警而不是一堆莫名其妙的编译错误。
      # 想彻底摆脱这个限制，需要把工程升级到 Dart 3 + 新版 Flutter（涉及老依赖升级）。
      - name: Select Xcode 14 if available
        run: |
          if ls -d /Applications/Xcode_14*.app >/dev/null 2>&1; then
            XCODE=$(ls -d /Applications/Xcode_14*.app | sort -V | tail -n1)
            echo "使用 $XCODE"
            sudo xcode-select -s "$XCODE"
          else
            echo "::notice::镜像无 Xcode 14，使用默认 Xcode。老 pod 的 libarclite 问题已在 ios/Podfile 中通过抬高 deployment target 处理"
          fi
          xcodebuild -version

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      # 不用手动 pod install --repo-update：flutter build ipa 会按需执行 pod install，
      # --repo-update 每次全量更新 CocoaPods specs 仓库，白白多花好几分钟。
      - name: Build unsigned archive (TrollStore --no-codesign)
        working-directory: flutter
        run: flutter build ipa --release --no-codesign --build-name=1.0.0 --build-number=1

      # 注意：--no-codesign 时 Flutter 只产出 Runner.xcarchive，日志会明确打印
      # "Codesigning disabled with --no-codesign, skipping IPA."，不会生成 ipa 目录。
      # TrollStore 用的未签名 IPA 自己打：IPA = Payload/*.app 的 zip。
      - name: Package unsigned IPA from xcarchive
        working-directory: flutter
        run: |
          APP=$(find build/ios/archive -maxdepth 4 -path '*/Products/Applications/*.app' | head -n1)
          if [ -z "$APP" ]; then
            echo "::error::xcarchive 里没有找到 .app"
            exit 1
          fi
          echo "打包 $APP"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          rm -rf build/ios/ipa/Payload/*.app/_CodeSignature
          rm -f build/ios/ipa/Payload/*.app/embedded.mobileprovision
          cd build/ios/ipa
          zip -qry qinglong-client-unsigned.ipa Payload
          ls -lh qinglong-client-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-client-trollstore-ipa
          path: flutter/build/ios/ipa/*.ipa
          # 默认 warn 会造成"步骤成功但产物为空"的假绿，这里直接判失败
          if-no-files-found: error
