name: Flutter iOS Build (TrollStore Unsigned IPA)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Pub get + Pod install
        run: |
          cd flutter
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build unsigned IPA (TrollStore, --no-codesign)
        run: |
          cd flutter
          flutter build ipa --release --no-codesign --build-name=1.0.0 --build-number=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-client-trollstore-ipa
          path: flutter/build/ios/ipa/*.ipa
