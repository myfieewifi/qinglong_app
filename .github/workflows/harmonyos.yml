name: HarmonyOS NEXT Build (HoKit Unsigned HAP)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-hos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Install Node.js (hvigor 依赖node)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ohpm install dependencies
        run: |
          cd harmonyos
          chmod +x hvigorw
          ./hvigorw --version
          ./hvigorw ohpm install --all

      - name: Build unsigned HAP (HoKit)
        run: |
          cd harmonyos
          ./hvigorw assembleHap --buildMode=release --no-daemon

      - name: Find HAP
        id: findhap
        run: |
          HAP=$(find harmonyos/build -name "*-unsigned.hap" | head -n1)
          echo "hap=$HAP" >> $GITHUB_OUTPUT

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-client-hokit-hap
          path: ${{ steps.findhap.outputs.hap }}
