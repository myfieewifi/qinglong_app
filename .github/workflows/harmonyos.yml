name: HarmonyOS NEXT Build (HoKit Unsigned HAP)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-hos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Download hos-sdk & load env
        run: |
          wget -O hos-sdk.zip https://github.com/harmonyos-dev/hos-sdk/releases/latest/download/hos-sdk.zip
          unzip -q hos-sdk.zip -d ./hos-sdk
          source ./hos-sdk/env.sh
          echo "HOS_SDK_HOME=$PWD/hos-sdk" >> $GITHUB_ENV
          echo "$PWD/hos-sdk/bin" >> $GITHUB_PATH

      - name: Ohpm install dependencies
        run: |
          source ./hos-sdk/env.sh
          cd harmonyos
          ohpm install --all

      - name: Build unsigned HAP (HoKit)
        run: |
          source ./hos-sdk/env.sh
          cd harmonyos
          hvigorw assembleHap --buildMode=release --no-daemon

      - name: Find HAP
        id: findhap
        run: |
          HAP=$(find harmonyos/build -name "*-unsigned.hap" | head -n1)
          echo "hap=$HAP" >> $GITHUB_OUTPUT

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-client-hokit-hap
          path: ${{ steps.findhap.outputs.hap }}
