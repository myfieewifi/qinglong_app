name: HarmonyOS NEXT Build (HoKit Unsigned HAP)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-hos:
    runs-on: ubuntu-latest
    # 仓库里没有 hvigorw / hvigorw.js（harmonyos/ 下只有 hvigorfile.ts 和 hvigor/），
    # 原 workflow 每次都会走到 else 分支 exit 1。这里直接跳过，不再每次 push 挂红叉。
    # 另外 HAP 构建依赖 DevEco Studio 的 HarmonyOS SDK，GitHub 托管 runner 上没有；
    # 真要出 HAP，需要补 hvigorw 包装脚本 + 自带 SDK 的 self-hosted runner。
    if: ${{ hashFiles('harmonyos/hvigorw', 'harmonyos/hvigorw.js') != '' }}
    continue-on-error: true  # 鸿蒙失败不影响其它平台的构建结论
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build HAP
        run: |
          cd harmonyos
          if [ -f "./hvigorw" ]; then
            chmod +x ./hvigorw
            ./hvigorw ohpm install --all
            ./hvigorw assembleHap --buildMode=release --no-daemon
          else
            node ./hvigorw.js ohpm install --all
            node ./hvigorw.js assembleHap --buildMode=release --no-daemon
          fi

      - name: Find HAP
        id: findhap
        run: |
          # 产物在 entry 模块的 build 目录下，不是 harmonyos/build
          HAP=$(find harmonyos/entry/build harmonyos/build -name "*-unsigned.hap" 2>/dev/null | head -n1)
          if [ -n "$HAP" ]; then
            echo "hap=$HAP" >> $GITHUB_OUTPUT
          else
            echo "未找到 unsigned HAP 产物"
            exit 1
          fi

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-client-hokit-hap
          path: ${{ steps.findhap.outputs.hap }}
